name: Factory APK Artifact

on:
  push:
    branches: [main]
    paths:
      - "apps/android-native/**"
      - "packages/factory-core/**"
      - ".github/workflows/factory-apk-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-native
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install exact supplied AI Game Factory icon
        shell: bash
        run: |
          set -euo pipefail
          ICON_URL="https://ec24441a-b74b-49ac-afbb-cbd919df26b6.sandbox.floot.app/_cdn/static/00d7946f-a914-46af-b902-0c4ccd2eb970-file_00000000a6908210892ae7c870d5d672.png"
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          curl --fail --location --retry 3 "$ICON_URL" -o /tmp/ai-game-factory-icon.png
          test -s /tmp/ai-game-factory-icon.png
          cp /tmp/ai-game-factory-icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp /tmp/ai-game-factory-icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp /tmp/ai-game-factory-icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp /tmp/ai-game-factory-icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp /tmp/ai-game-factory-icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          sha256sum /tmp/ai-game-factory-icon.png | tee app/src/main/res/mipmap-mdpi/ICON-SHA256.txt
      - name: Build installable debug APK
        run: gradle --no-daemon clean assembleDebug
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > app/build/outputs/apk/debug/SHA256SUMS
          ls -lh "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Game-Factory-APK-${{ github.run_number }}
          if-no-files-found: error
          path: |
            apps/android-native/app/build/outputs/apk/debug/app-debug.apk
            apps/android-native/app/build/outputs/apk/debug/SHA256SUMS
