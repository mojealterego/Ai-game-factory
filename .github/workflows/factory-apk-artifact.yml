name: Factory APK Artifact

on:
  push:
    branches: [main]
    paths:
      - "apps/android-native/**"
      - "packages/factory-core/**"
      - ".github/workflows/factory-apk-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-native
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build installable debug APK
        run: gradle --no-daemon clean assembleDebug
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > app/build/outputs/apk/debug/SHA256SUMS
          ls -lh "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Game-Factory-APK-${{ github.run_number }}
          if-no-files-found: error
          path: |
            apps/android-native/app/build/outputs/apk/debug/app-debug.apk
            apps/android-native/app/build/outputs/apk/debug/SHA256SUMS
