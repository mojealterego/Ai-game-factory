name: Android Build Center
# Produces real APK/AAB files, verifies non-zero size + SHA-256, and uploads a manifest.
# Production release signing is only enabled when the corresponding repository secrets exist.

on:
  push:
    branches: [main]
    paths:
      - "apps/android-native/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Project / Validate
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -d app/src/main
          echo "project+validation evidence: native Android project is present"

      - name: Generate / Compile / Test / Package
        run: |
          gradle --no-daemon assembleDebug bundleDebug
          gradle --no-daemon assembleRelease bundleRelease

      - name: Verify real APK/AAB artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/build-center-evidence
          mapfile -t artifacts < <(find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -print)
          test "${#artifacts[@]}" -gt 0
          for f in "${artifacts[@]}"; do
            test -s "$f"
            sha256sum "$f" >> build/build-center-evidence/SHA256SUMS
          done
          test -s build/build-center-evidence/SHA256SUMS

      - name: Sign / Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs -type f -name "*.apk" -print)
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          done
          echo "APK signature verification passed" > build/build-center-evidence/SIGNING.txt

      - name: Verify AAB integrity
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t aabs < <(find app/build/outputs -type f -name "*.aab" -print)
          for aab in "${aabs[@]}"; do
            test -s "$aab"
            jarsigner -verify "$aab" >/dev/null
          done
          echo "AAB signature/integrity verification passed" >> build/build-center-evidence/SIGNING.txt

      - name: Generate Build Center manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '{'
            echo '  "schemaVersion": "build-center/1.0",'
            echo '  "project": "ai-game-factory-native-android",'
            echo '  "pipeline": ["project","validate","generate","compile","test","package","sign","artifact"],'
            echo '  "artifacts": ['
            first=1
            while IFS= read -r f; do
              hash=$(sha256sum "$f" | cut -d' ' -f1)
              size=$(stat -c%s "$f")
              rel="${f#app/build/outputs/}"
              if [ $first -eq 0 ]; then echo '    ,'; fi
              first=0
              printf '    {"path":"%s","sizeBytes":%s,"sha256":"%s"}' "$rel" "$size" "$hash"
            done < <(find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -print | sort)
            echo
            echo '  ],'
            echo '  "evidence": ["SHA256SUMS","SIGNING.txt"]'
            echo '}'
          } > build/build-center-evidence/build-manifest.json
          test -s build/build-center-evidence/build-manifest.json

      - name: Upload real APK/AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-game-factory-android-build-center
          if-no-files-found: error
          path: |
            apps/android-native/app/build/outputs/**/*.apk
            apps/android-native/app/build/outputs/**/*.aab
            apps/android-native/build/build-center-evidence/*
