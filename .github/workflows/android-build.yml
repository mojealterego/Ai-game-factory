name: Android Build

on:
  push:
    branches: [main]
    paths:
      - "apps/android-native/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - run: gradle --no-daemon assembleDebug
      - run: gradle --no-daemon assembleRelease bundleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-game-factory-apk
          path: |
            apps/android-native/app/build/outputs/apk/debug/*.apk
            apps/android-native/app/build/outputs/apk/release/*.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ai-game-factory-aab
          path: apps/android-native/app/build/outputs/bundle/release/*.aab
